name: ros2 ci
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read
  issues: write         # hiding bot comments
  pull-requests: write  # hiding bot comments

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine-version: "3.23"
            ros-distro: jazzy
          - alpine-version: "3.23"
            ros-distro: humble
    uses: alpine-ros/alpine-ros-ci-workflows/.github/workflows/ros2.yaml@main
    with:
      alpine-version: ${{ matrix.alpine-version }}
      ros-distro: ${{ matrix.ros-distro }}
      enable-bot-comment: true
      # Shared with the ROS 1 job. sq_ros1_rclcpp_compat is a ROS 1-only
      # dependency: it gets checked out, but manifest-files below keeps it
      # out of the build.
      rosinstall-files: .rosinstall
      # The neonavigation metapackage is a ROS 1 concept (catkin metapackages
      # have no ROS 2 equivalent), so it is not built here.
      manifest-files: |
        costmap_cspace/package.xml
        joystick_interrupt/package.xml
        map_organizer/package.xml
        neonavigation_common/package.xml
        neonavigation_launch/package.xml
        obj_to_pointcloud/package.xml
        planner_cspace/package.xml
        safety_limiter/package.xml
        track_odometry/package.xml
        trajectory_tracker/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/costmap_cspace_msgs/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/map_organizer_msgs/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/neonavigation_metrics_msgs/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/planner_cspace_msgs/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/safety_limiter_msgs/package.xml
        ../../home/builder/extsrc/neonavigation_msgs/trajectory_tracker_msgs/package.xml
    secrets:
      bot-comment-token: ${{ secrets.GITHUB_TOKEN }}
